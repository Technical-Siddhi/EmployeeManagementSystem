<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 24px; font-weight: 800; }
      .subtitle { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 14px; }
      .group-box { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 12; }
      .group-header { fill: #38bdf8; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
      .entity-box { fill: #090d16; stroke: #6366f1; stroke-width: 1.5; rx: 8; }
      .entity-header { fill: #818cf8; font-family: monospace; font-size: 13px; font-weight: 700; }
      .entity-field { fill: #cbd5e1; font-family: monospace; font-size: 11px; }
      .entity-pk { fill: #f59e0b; font-family: monospace; font-size: 11px; font-weight: 700; }
      .entity-fk { fill: #38bdf8; font-family: monospace; font-size: 11px; }
      .line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .rel-label { fill: #a5b4fc; font-family: system-ui, sans-serif; font-size: 10px; font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="900"/>

  <!-- Title -->
  <text x="40" y="45" class="title">AttendX — Enterprise Database ER Diagram</text>
  <text x="40" y="70" class="subtitle">MongoDB Atlas Schema Architecture & Entity Relationships (v2.5.0)</text>

  <!-- 1. Core & Auth Module -->
  <rect x="40" y="100" width="340" height="350" class="group-box"/>
  <text x="60" y="130" class="group-header">1. Core & Authentication</text>

  <!-- User Entity -->
  <rect x="60" y="150" width="140" height="110" class="entity-box"/>
  <text x="70" y="170" class="entity-header">User</text>
  <text x="70" y="190" class="entity-pk">🔑 _id: ObjectId</text>
  <text x="70" y="205" class="entity-field">email: String</text>
  <text x="70" y="220" class="entity-field">password: String</text>
  <text x="70" y="235" class="entity-fk">🔗 role: Role</text>

  <!-- Role Entity -->
  <rect x="220" y="150" width="140" height="90" class="entity-box"/>
  <text x="230" y="170" class="entity-header">Role</text>
  <text x="230" y="190" class="entity-pk">🔑 _id: ObjectId</text>
  <text x="230" y="205" class="entity-field">name: String</text>
  <text x="230" y="220" class="entity-field">permissions: Array</text>

  <!-- Employee Entity -->
  <rect x="60" y="280" width="300" height="150" class="entity-box"/>
  <text x="70" y="300" class="entity-header">Employee</text>
  <text x="70" y="320" class="entity-pk">🔑 _id: ObjectId</text>
  <text x="70" y="335" class="entity-fk">🔗 user: User</text>
  <text x="70" y="350" class="entity-fk">🔗 department: Department</text>
  <text x="70" y="365" class="entity-fk">🔗 team: Team</text>
  <text x="70" y="380" class="entity-fk">🔗 designation: Designation</text>
  <text x="70" y="395" class="entity-field">firstName: String, lastName: String</text>
  <text x="70" y="410" class="entity-field">status: Enum['Active', 'Leave']</text>

  <!-- 2. Organization Module -->
  <rect x="420" y="100" width="340" height="350" class="group-box"/>
  <text x="440" y="130" class="group-header">2. Organization Architecture</text>

  <!-- Department Entity -->
  <rect x="440" y="150" width="140" height="100" class="entity-box"/>
  <text x="450" y="170" class="entity-header">Department</text>
  <text x="450" y="190" class="entity-pk">🔑 _id: ObjectId</text>
  <text x="450" y="205" class="entity-field">name: String</text>
  <text x="450" y="220" class="entity-field">code: String</text>
  <text x="450" y="235" class="entity-fk">🔗 head: Employee</text>

  <!-- Team Entity -->
  <rect x="600" y="150" width="140" height="100" class="entity-box"/>
  <text x="610" y="170" class="entity-header">Team</text>
  <text x="610" y="190" class="entity-pk">🔑 _id: ObjectId</text>
  <text x="610" y="205" class="entity-field">name: String</text>
  <text x="610" y="220" class="entity-fk">🔗 dept: Department</text>
  <text x="610" y="235" class="entity-fk">🔗 lead: Employee</text>

  <!-- Designation Entity -->
  <rect x="440" y="280" width="140" height="90" class="entity-box"/>
  <text x="450" y="300" class="entity-header">Designation</text>
  <text x="450" y="320" class="entity-pk">🔑 _id: ObjectId</text>
  <text x="450" y="335" class="entity-field">title: String</text>
  <text x="450" y="350" class="entity-field">payGrade: String</text>

  <!-- 3. Workforce Operations Module -->
  <rect x="800" y="100" width="360" height="750" class="group-box"/>
  <text x="820" y="130" class="group-header">3. Workforce Operations</text>

  <!-- Attendance Entity -->
  <rect x="820" y="150" width="150" height="110" class="entity-box"/>
  <text x="830" y="170" class="entity-header">Attendance</text>
  <text x="830" y="190" class="entity-pk">🔑 _id: ObjectId</text>
  <text x="830" y="205" class="entity-fk">🔗 employee: Employee</text>
  <text x="830" y="220" class="entity-field">date: Date</text>
  <text x="830" y="235" class="entity-field">checkIn / Out: Date</text>

  <!-- Leave Entity -->
  <rect x="990" y="150" width="150" height="110" class="entity-box"/>
  <text x="1000" y="170" class="entity-header">Leave</text>
  <text x="1000" y="190" class="entity-pk">🔑 _id: ObjectId</text>
  <text x="1000" y="205" class="entity-fk">🔗 applicant: Employee</text>
  <text x="1000" y="220" class="entity-field">type: Enum</text>
  <text x="1000" y="235" class="entity-field">status: Enum</text>

  <!-- Payroll Entity -->
  <rect x="820" y="280" width="150" height="110" class="entity-box"/>
  <text x="830" y="300" class="entity-header">Payroll</text>
  <text x="830" y="320" class="entity-pk">🔑 _id: ObjectId</text>
  <text x="830" y="335" class="entity-fk">🔗 employee: Employee</text>
  <text x="830" y="350" class="entity-field">netSalary: Number</text>
  <text x="830" y="365" class="entity-field">month: String</text>

  <!-- Performance Review Entity -->
  <rect x="990" y="280" width="150" height="110" class="entity-box"/>
  <text x="1000" y="300" class="entity-header">PerformanceReview</text>
  <text x="1000" y="320" class="entity-pk">🔑 _id: ObjectId</text>
  <text x="1000" y="335" class="entity-fk">🔗 employee: Employee</text>
  <text x="1000" y="350" class="entity-field">score: Number</text>
  <text x="1000" y="365" class="entity-field">cycle: String</text>

  <!-- HelpDesk Ticket Entity -->
  <rect x="820" y="410" width="320" height="110" class="entity-box"/>
  <text x="830" y="430" class="entity-header">Ticket (Help Desk)</text>
  <text x="830" y="450" class="entity-pk">🔑 _id: ObjectId</text>
  <text x="830" y="465" class="entity-fk">🔗 requester: Employee, 🔗 assignee: Employee</text>
  <text x="830" y="480" class="entity-field">subject: String, status: Enum, priority: Enum</text>

  <!-- AI Conversation Entity -->
  <rect x="820" y="540" width="320" height="110" class="entity-box"/>
  <text x="830" y="560" class="entity-header">AIConversation</text>
  <text x="830" y="580" class="entity-pk">🔑 _id: ObjectId</text>
  <text x="830" y="595" class="entity-fk">🔗 user: User</text>
  <text x="830" y="610" class="entity-field">messages: Array[{ sender, text, timestamp }]</text>

  <!-- AuditLog Entity -->
  <rect x="820" y="670" width="320" height="110" class="entity-box"/>
  <text x="830" y="690" class="entity-header">AuditLog</text>
  <text x="830" y="710" class="entity-pk">🔑 _id: ObjectId</text>
  <text x="830" y="725" class="entity-fk">🔗 user: User</text>
  <text x="830" y="740" class="entity-field">action: String, resource: String, ip: String</text>

  <!-- Connecting Lines with Labels -->
  <!-- User -> Role -->
  <path d="M 200 195 L 220 195" class="line" marker-end="url(#arrow)"/>
  <!-- Employee -> User -->
  <path d="M 130 280 L 130 260" class="line" marker-end="url(#arrow)"/>
  <!-- Employee -> Department -->
  <path d="M 360 350 L 440 200" class="line" marker-end="url(#arrow)"/>
  <!-- Employee -> Attendance -->
  <path d="M 360 380 L 820 205" class="line" marker-end="url(#arrow)"/>
  <!-- Employee -> Leave -->
  <path d="M 360 380 L 990 205" class="line" marker-end="url(#arrow)"/>
  <!-- Employee -> Payroll -->
  <path d="M 360 380 L 820 335" class="line" marker-end="url(#arrow)"/>
  <!-- Employee -> Performance -->
  <path d="M 360 380 L 990 335" class="line" marker-end="url(#arrow)"/>

</svg>
